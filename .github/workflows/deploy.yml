name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy-engine:
    name: Deploy Engine (Google Cloud Run)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        if: env.GCP_SA_KEY != ''
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        if: env.GCP_PROJECT_ID != ''
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build and Push Docker image
        if: env.GCP_PROJECT_ID != ''
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
          docker build -t asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/vyoman/engine:${{ github.sha }} .
          docker push asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/vyoman/engine:${{ github.sha }}
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        if: env.GCP_PROJECT_ID != ''
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: vyoman-engine
          region: asia-south1
          image: asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/vyoman/engine:${{ github.sha }}
          flags: "--allow-unauthenticated --memory=1Gi --cpu=1"
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

  deploy-web:
    name: Deploy Web (Cloudflare / OpenNext)
    runs-on: ubuntu-latest
    needs: [deploy-engine]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and Lint
        run: |
          npm run typecheck
          npm run lint

      - name: Build and Deploy Cloudflare OpenNext
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npm run cf:build
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          ENGINE_BASE_URL: ${{ secrets.ENGINE_BASE_URL }}
